<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex Miramontes Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="I'm a third-year mechanical engineering student at Harvard College, Class of 2028. I design, analyze, and build mechanical and electromechanical systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
/* Layout: light, single-theme engineering portfolio. 1180px wrap, sticky header, two-column hero, 2-up project cards, tinted experience band. */
:root {
  --ink: #17212e;
  --muted: #596574;
  --line: #dce2e8;
  --soft: #f3f5f7;
  --blue: #174d9e;
  --blue-soft: #eaf1fb;
  --white: #ffffff;
  --draw: #3a4656;
  --wrap: 1180px;
  --radius: 8px;
  --font: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--white); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--white); }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-weight: 650; text-wrap: balance; color: var(--ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 3px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 16px; z-index: 60; background: var(--ink); color: var(--white); padding: 8px 12px; }

.wrap {
  max-width: var(--wrap); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 760px) {
  .wrap { padding-left: max(64px, env(safe-area-inset-left, 0px)); padding-right: max(64px, env(safe-area-inset-right, 0px)); }
}

/* ---------- Header ---------- */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--white); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 16px; }
.brand { font-weight: 650; font-size: 17px; letter-spacing: -0.03em; }
.dot { color: var(--blue); }
.nav { display: flex; align-items: center; gap: 25px; font-size: 14px; font-weight: 500; }
.nav a { padding: 6px 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--blue); }
.nav a[aria-current="page"] { color: var(--blue); border-bottom-color: var(--blue); }
.nav a.resume { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-left: 4px; }
.nav a.resume:hover { border-color: var(--ink); color: var(--ink); }
.menu-btn { display: none; font: inherit; font-size: 14px; font-weight: 500; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 8px 0; }
@media (max-width: 760px) {
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; background: var(--white); border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 16px; }
  .nav.open { display: flex; }
  .nav a { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .nav a[aria-current="page"] { border-bottom-color: var(--line); }
  .nav a.resume { border: 0; border-radius: 0; margin: 0; padding: 12px 0; }
}

/* ---------- Shared type ---------- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue); }
.lead { font-size: 18px; line-height: 1.65; color: var(--muted); max-width: 33em; }
.muted { color: var(--muted); }
.arrow { font-size: 0.9em; }
.ulink { font-weight: 600; font-size: 15px; border-bottom: 1.5px solid var(--ink); padding-bottom: 3px; }
.ulink:hover { color: var(--blue); border-color: var(--blue); }
.btn { display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; padding: 12px 18px; border-radius: 4px; border: 1px solid var(--ink); background: var(--white); color: var(--ink); }
.btn.dark { background: var(--ink); color: var(--white); }
.btn.dark:hover { background: var(--blue); border-color: var(--blue); }
.btn:not(.dark):hover { border-color: var(--blue); color: var(--blue); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.social { display: flex; flex-wrap: wrap; gap: 22px; font-size: 13px; font-weight: 500; }
.social a:hover { color: var(--blue); }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 72px; align-items: center; padding-block: 72px 80px; }
.hero > * { min-width: 0; }
.hero-copy { display: grid; gap: 26px; }
.hero h1 { font-size: clamp(52px, 7.2vw, 83px); line-height: 1.03; letter-spacing: -0.055em; }
.hero figure { margin: 0; display: grid; gap: 12px; }
.hero-img { background: var(--soft); border-radius: var(--radius); overflow: hidden; aspect-ratio: 8 / 7; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
.cap-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: var(--muted); }
.cap-row a { color: var(--ink); font-weight: 500; }
.cap-row a:hover { color: var(--blue); }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; gap: 40px; padding-block: 48px 56px; } }

/* ---------- Sections ---------- */
.section { padding-block: 56px 88px; border-top: 1px solid var(--line); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
.sec-head > div { display: grid; gap: 10px; }
.sec-head h2 { font-size: clamp(30px, 4vw, 38px); line-height: 1.15; letter-spacing: -0.035em; }

/* ---------- Project cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px 30px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; gap: 44px; } }
.card { display: grid; gap: 16px; align-content: start; }
.card .media { aspect-ratio: 509 / 350; }
.media { background: var(--soft); border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; padding: 10px; color: var(--draw); }
.media { position: relative; }
.media img, .media svg { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; }
.media.cover { padding: 0; }
.media.cover img { inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lead-fig .media img, .lead-fig .media svg { inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); }
.photo .media img { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
.card:hover .media { box-shadow: inset 0 0 0 1px var(--line); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; color: var(--muted); }
.meta .right { display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-soft); color: var(--blue); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.title-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.card h3 { font-size: clamp(20px, 2.2vw, 24px); line-height: 1.25; letter-spacing: -0.03em; }
.card .title-row .arrow { font-size: 20px; line-height: 1.2; }
.card:hover h3, .card:hover .title-row .arrow { color: var(--blue); }
.card p { color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 34em; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
.filters button { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.filters button:hover { color: var(--ink); border-color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }

/* ---------- Experience band ---------- */
.band { background: var(--soft); }
.band-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; padding-block: 72px 80px; }
.band-inner > * { min-width: 0; }
.band-copy { display: grid; gap: 20px; align-content: start; }
.band-copy h2 { font-size: clamp(30px, 4vw, 38px); line-height: 1.15; letter-spacing: -0.035em; }
.band-copy .lead { font-size: 16px; }
.xrows { border-top: 0; }
.xrow { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 18px; align-items: center; padding-block: 18px; border-bottom: 1px solid var(--line); }
.xrow:first-child { padding-top: 0; }
.xrow b { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; display: block; }
.xrow span.role { font-size: 13px; color: var(--muted); }
.xrow .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.xrow:hover b, .xrow:hover .arrow { color: var(--blue); }
@media (max-width: 900px) { .band-inner { grid-template-columns: 1fr; gap: 40px; padding-block: 56px; } }
@media (max-width: 480px) { .xrow { grid-template-columns: 1fr auto; } .xrow .when { grid-column: 1; grid-row: 2; } }

/* ---------- Contact strip ---------- */
.touch { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 64px; }
.touch h2 { font-size: clamp(28px, 3.6vw, 34px); letter-spacing: -0.035em; }
.touch p { color: var(--muted); font-size: 15px; margin-top: 8px; }
.email-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.email { font-weight: 600; font-size: 15px; border-bottom: 1.5px solid var(--ink); padding-bottom: 3px; word-break: break-all; }
.email:hover { color: var(--blue); border-color: var(--blue); }
.copy { font: inherit; font-size: 12px; font-weight: 500; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
.copy:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--line); }
.foot-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 36px 24px; border-bottom: 1px solid var(--line); }
.foot-top b { display: block; font-weight: 650; font-size: 15px; }
.foot-top small { font-size: 12px; color: var(--muted); }
.foot-links { display: flex; gap: 22px; flex-wrap: wrap; font-size: 12px; font-weight: 500; }
.foot-links a:hover, .foot-bottom a:hover { color: var(--blue); }
.foot-bottom { display: flex; justify-content: space-between; gap: 16px; padding-block: 18px 32px; font-size: 11px; color: var(--muted); }

/* ---------- Subpage heads ---------- */
.page-head { padding-block: 64px 48px; display: grid; gap: 18px; }
.page-head h1 { font-size: clamp(44px, 6vw, 64px); line-height: 1.05; letter-spacing: -0.05em; }
.crumb { font-size: 12px; color: var(--muted); padding-top: 28px; }
.crumb a { color: var(--ink); font-weight: 500; }
.crumb a:hover { color: var(--blue); }
.crumb span { margin-inline: 8px; }

/* ---------- Project detail ---------- */
.p-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; padding-block: 40px 56px; }
.p-hero > * { min-width: 0; }
.p-hero .copy-col { display: grid; gap: 22px; }
.p-hero h1 { font-size: clamp(38px, 5vw, 52px); line-height: 1.08; letter-spacing: -0.045em; }
.p-hero .lead { font-size: 17px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin: 0; }
.facts dt { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.facts dd { margin: 0; font-size: 13px; line-height: 1.5; }
.jumps { display: flex; flex-wrap: wrap; gap: 18px; font-size: 12px; font-weight: 600; color: var(--blue); }
.jumps button { font: inherit; color: inherit; background: none; border: 0; padding: 0 0 3px; border-bottom: 1px solid currentColor; cursor: pointer; }
.lead-fig { margin: 0; background: var(--soft); border-radius: var(--radius); overflow: hidden; display: grid; }
.lead-fig .media { aspect-ratio: 5 / 4; border-radius: 0; padding: 18px; }
.lead-fig figcaption { font-size: 12px; color: var(--muted); padding: 0 18px 14px; }
@media (max-width: 900px) { .p-hero { grid-template-columns: 1fr; gap: 36px; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 22px 24px 22px 0; display: grid; gap: 4px; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 24px; }
.stat b { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 600px) { .stat + .stat { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; } }

.p-body { display: grid; grid-template-columns: 210px 1fr; gap: 120px; padding-block: 72px 40px; }
.p-body > * { min-width: 0; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); align-self: start; display: grid; gap: 24px; }
.side .label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.toc { display: grid; gap: 10px; }
.toc button { font: inherit; font-size: 12px; line-height: 1.45; text-align: left; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; }
.toc button:hover { color: var(--blue); }
.side .tools { font-size: 12px; color: var(--muted); line-height: 1.6; padding-top: 22px; border-top: 1px solid var(--line); }
.prose { display: grid; gap: 52px; max-width: 660px; }
.prose section { display: grid; gap: 18px; scroll-margin-top: 100px; }
.prose h2 { font-size: 26px; letter-spacing: -0.035em; line-height: 1.2; }
.prose p { font-size: 16px; line-height: 1.75; color: var(--muted); }
.prose p strong { color: var(--ink); font-weight: 600; }
.prose ul { margin: 0; padding-left: 1.15em; display: grid; gap: 8px; color: var(--muted); line-height: 1.7; }
.prose li::marker { color: var(--blue); }
.eq { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; font-size: 18px; color: var(--ink); background: var(--soft); border-radius: 6px; padding: 14px 18px; overflow-x: auto; white-space: nowrap; }
.eq sub { font-size: 0.7em; }
@media (max-width: 900px) { .p-body { grid-template-columns: 1fr; gap: 32px; padding-block: 48px 24px; } .side { position: static; } }

.photos { padding-block: 56px 72px; border-top: 1px solid var(--line); }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px 20px; }
.photo { display: grid; gap: 10px; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: zoom-in; }
.photo .media { aspect-ratio: 4 / 3; padding: 6px; }
.photo:hover .media { box-shadow: inset 0 0 0 1px var(--line); }
.photo span { font-size: 12px; font-style: italic; color: var(--muted); line-height: 1.5; }

/* ---------- Video ---------- */
.video { padding-block: 56px 8px; display: grid; gap: 20px; }
.vcard { display: grid; gap: 10px; max-width: 520px; }
.vthumb { aspect-ratio: 16 / 9; border-radius: var(--radius); background: var(--ink); display: grid; place-items: center; position: relative; overflow: hidden; }
.vthumb .play { width: 68px; height: 48px; border-radius: 12px; background: #e62117; display: grid; place-items: center; }
.vthumb .play::after { content: ""; border-left: 18px solid #ffffff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 4px; }
.vthumb .tag { position: absolute; left: 14px; bottom: 12px; font-size: 11px; font-weight: 600; color: #ffffff; opacity: .85; }
.vcard:hover .vthumb { background: var(--blue); }
.vrow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.vrow b { font-weight: 600; }
.vrow span { color: var(--muted); font-size: 12px; }

/* ---------- Lightbox ---------- */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(15, 20, 28, 0.92); display: grid; grid-template-rows: auto 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); color: var(--white); }
.lb-top { display: flex; justify-content: flex-end; gap: 10px; }
.lb-top button, .lb-nav button { font: inherit; font-size: 13px; font-weight: 500; color: var(--white); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.lb-top button:hover, .lb-nav button:hover { background: rgba(255,255,255,0.18); }
.lb-stage { display: grid; place-items: center; min-height: 0; padding-block: 12px; }
.lb-stage img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 4px; background: var(--white); }
.lb-nav { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.lb-nav p { font-size: 13px; font-style: italic; text-align: center; color: #d9dee5; }

/* ---------- Experience page ---------- */
.xlist { display: grid; }
.xitem { display: grid; grid-template-columns: 240px 1fr; gap: 48px; padding-block: 36px; border-top: 1px solid var(--line); }
.xitem > * { min-width: 0; }
.xitem .when { font-size: 13px; color: var(--muted); display: grid; gap: 2px; align-content: start; }
.xitem .when b { color: var(--ink); font-weight: 600; }
.xitem .body { display: grid; gap: 12px; max-width: 660px; }
.xitem h3 { font-size: 22px; letter-spacing: -0.03em; }
.xitem .org { font-size: 14px; color: var(--blue); font-weight: 600; }
.xitem p { color: var(--muted); line-height: 1.7; }
.xitem ul { margin: 0; padding-left: 1.15em; display: grid; gap: 8px; color: var(--muted); line-height: 1.65; }
.xitem li::marker { color: var(--blue); }
@media (max-width: 760px) { .xitem { grid-template-columns: 1fr; gap: 10px; } }

/* ---------- About ---------- */
.about { display: grid; grid-template-columns: 1.25fr 1fr; gap: 96px; padding-bottom: 88px; }
.about > * { min-width: 0; }
.about .prose { gap: 22px; }
.facts-col { display: grid; gap: 30px; align-content: start; }
.facts-col h3 { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.facts-col ul { margin: 0; padding: 0; list-style: none; display: grid; }
.facts-col li { font-size: 14px; padding-block: 9px; border-bottom: 1px solid var(--line); line-height: 1.5; }
.facts-col li:first-child { border-top: 1px solid var(--line); }
.facts-col li small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 900px) { .about { grid-template-columns: 1fr; gap: 48px; } }

main { min-height: 60vh; }
</style>
</head>

<script>
// ================= Links =================
const EMAIL = "amiramontesrodriguez@college.harvard.edu";
const LINKEDIN = "https://www.linkedin.com/in/alex-miramontes-rodriguez";
const RESUME = "assets/downloads/Alex-Miramontes-Resume.pdf";
const IMG = "assets/projects/";

// ================= Router =================
const main = document.getElementById("main");
const BASE = "Alex Miramontes | Mechanical Engineering";
let current = null;

function render() {
  const h = location.hash.replace(/^#/, "");
  if (h === "top") { window.scrollTo(0, 0); return; }
  const p = PROJECTS.find(x => x.id === h);
  let html, title = BASE, nav = "";
  if (p) { html = viewProject(p); title = p.title + " | Alex Miramontes"; nav = "projects"; }
  else if (h === "projects") { html = viewProjects(); title = "Projects | Alex Miramontes"; nav = "projects"; }
  else if (h === "experience") { html = viewExperience(); title = "Experience | Alex Miramontes"; nav = "experience"; }
  else if (h === "about") { html = viewAbout(); title = "About | Alex Miramontes"; nav = "about"; }
  else if (h === "contact") { html = viewContact(); title = "Contact | Alex Miramontes"; nav = "contact"; }
  else { html = viewHome(); }
  current = p || null;
  main.innerHTML = html;
  document.title = title;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  closeMenu();
  window.scrollTo(0, 0);
}

// ================= Menu =================
const menuBtn = document.getElementById("menu-btn");
const navEl = document.getElementById("site-nav");
function closeMenu() { navEl.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); menuBtn.textContent = "Menu +"; }
menuBtn.addEventListener("click", () => {
  const open = navEl.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.textContent = open ? "Close ×" : "Menu +";
});

// ================= Lightbox =================
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lb-img");
const lbCap = document.getElementById("lb-cap");
let lbIndex = 0;
function showPhoto(i) {
  const list = current ? current.photos : [];
  if (!list.length) return;
  lbIndex = (i + list.length) % list.length;
  lbImg.src = IMG + list[lbIndex][0];
  lbImg.alt = list[lbIndex][1];
  lbCap.textContent = list[lbIndex][1] + "  (" + (lbIndex + 1) + " of " + list.length + ")";
  lb.hidden = false;
  document.getElementById("lb-close").focus();
}
function closeLb() { lb.hidden = true; }
document.getElementById("lb-close").addEventListener("click", closeLb);
document.getElementById("lb-prev").addEventListener("click", () => showPhoto(lbIndex - 1));
document.getElementById("lb-next").addEventListener("click", () => showPhoto(lbIndex + 1));
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-stage")) closeLb(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") showPhoto(lbIndex - 1);
  if (e.key === "ArrowRight") showPhoto(lbIndex + 1);
});

// ================= Clicks =================
document.addEventListener("click", e => {
  const ph = e.target.closest("[data-photo]");
  if (ph) { showPhoto(Number(ph.dataset.photo)); return; }

  const j = e.target.closest("[data-jump]");
  if (j) { const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({ block: "start" }); return; }

  const f = e.target.closest("[data-filter]");
  if (f) {
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b === f)));
    document.querySelectorAll("#project-grid .card").forEach(c => { c.hidden = !(f.dataset.filter === "All" || c.dataset.cat === f.dataset.filter); });
    return;
  }

  const c = e.target.closest("[data-copy]");
  if (c) {
    const done = () => { c.textContent = "Copied"; setTimeout(() => { c.textContent = "Copy"; }, 1500); };
    const fallback = () => {
      const el = c.parentElement.querySelector(".email");
      const r = document.createRange(); r.selectNodeContents(el);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      c.textContent = "Selected";
    };
    try { navigator.clipboard.writeText(c.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
    return;
  }

  if (e.target.closest("#to-top")) { e.preventDefault(); window.scrollTo(0, 0); }
});

window.addEventListener("hashchange", render);
render();
</script>
